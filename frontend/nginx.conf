server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para el modo "history" de Vue Router: cualquier ruta
    # desconocida por Nginx se resuelve devolviendo index.html,
    # dejando que Vue Router maneje la navegación en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }
}
