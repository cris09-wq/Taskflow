# TASKFLOW (rama frontend) - Orquestación del frontend Vue 3.
#
# Este compose construye y sirve SOLO la aplicación Vue (build estático Nginx).
# La API REST + Socket.IO, Redis y el Worker corren por separado
# (rama "backend" del repositorio). Ajusta VITE_API_URL / VITE_SOCKET_URL
# para apuntar al backend que tengas levantado.

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URLs consumidas por el NAVEGADOR: usan localhost + puerto publicado,
        # nunca el nombre del servicio Docker.
        VITE_API_URL: http://localhost:4000/api
        VITE_SOCKET_URL: http://localhost:4000
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"   # Puerto publicado al host: http://localhost:8080