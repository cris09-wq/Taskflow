# TASKFLOW (rama backend) - Orquestación de los servicios del backend:
# redisserver, backend y worker.
# Todos los servicios se comunican entre sí utilizando sus nombres de
# servicio (nunca "localhost") dentro de la red "taskflow-network".
#
# Nota: MongoDB no se orquesta con Docker Compose; el proyecto se conecta a
# MongoDB Atlas (nube) mediante la variable MONGO_URI (ver README).
# El frontend (Vue) vive en la rama "frontend" del repositorio y se ejecuta
# por separado contra esta API.

services:

  # ------------------------------------------------------------------
  # Redis - Caché y cola de procesamiento (HU-04, HU-08)
  # ------------------------------------------------------------------
  redisserver:
    image: redis:7-alpine
    container_name: taskflow-redisserver
    restart: unless-stopped
    ports:
      - "6379:6379"   # Puerto publicado al host (opcional, útil para depurar con redis-cli)
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Backend - Node.js + Express + Socket.IO (API REST)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "4000:4000"   # Puerto publicado al host, consumido por el navegador (frontend) o el cliente API
    environment:
      PORT: 4000
      MONGO_URI: "${MONGO_URI:-mongodb://mongoserver:27017/taskflow}"
      REDIS_HOST: redisserver
      REDIS_PORT: 6379
      CACHE_TTL: 60
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      redisserver:
        condition: service_healthy
    networks:
      - taskflow-network

  # ------------------------------------------------------------------
  # Worker - Proceso independiente de procesamiento asíncrono (HU-05)
  # ------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: taskflow-worker
    restart: unless-stopped
    environment:
      MONGO_URI: "${MONGO_URI:-mongodb://mongoserver:27017/taskflow}"
      REDIS_HOST: redisserver
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: 2
      HEARTBEAT_INTERVAL_MS: 5000
      PROCESSING_DELAY_MS: 2000
    depends_on:
      redisserver:
        condition: service_healthy
    networks:
      - taskflow-network
    # El Worker no expone puertos: no atiende peticiones del usuario (sección 8).

networks:
  taskflow-network:
    driver: bridge